{% extends 'base.html' %}

{% block title %}Registro - Santa corridas{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill display-3 text-primary"></i>
                    <h2 class="mt-2">Criar Conta</h2>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirm" class="form-label">Confirmar Senha</label>
                        <input type="password" class="form-control" id="confirm" name="confirm" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Criar Conta</button>
                </form>
                <p class="text-center mt-4 mb-0">
                    Já tem conta? <a href="{{ url_for('login') }}" class="fw-semibold">Faça login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
