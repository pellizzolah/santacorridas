{% extends 'base.html' %}

{% block title %}Login - Santa corridas{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-lightning-charge-fill display-3 text-primary"></i>
                    <h2 class="mt-2">Bem-vindo de volta!</h2>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Entrar</button>
                </form>
                <p class="text-center mt-4 mb-0">
                    Não tem conta? <a href="{{ url_for('register') }}" class="fw-semibold">Registre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
